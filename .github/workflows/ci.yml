name: CI

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - "assets/**"
      - "packaging/**"
      - "Dockerfile"
      - "docker/**"
      - "docker-compose.yml"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - "assets/**"
      - "packaging/**"
      - "Dockerfile"
      - "docker/**"
      - "docker-compose.yml"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # CI always builds from a warm cache; incremental artifacts only bloat the
  # cache and increase runner memory/disk usage.
  CARGO_INCREMENTAL: 0

jobs:
  check:
    name: fmt, clippy and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y --no-install-recommends \
            pkg-config \
            libx11-dev libxcb1-dev libxcb-composite0-dev libxcb-cursor-dev \
            libxcb-image0-dev libxcb-icccm4-dev libxcb-keysyms1-dev \
            libxcb-randr0-dev libxcb-render0-dev libxcb-render-util0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxcb-xinerama0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev

      # Pinned so a new stable release cannot introduce lints that fail an
      # unrelated tag build. Bump deliberately in both workflows.
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        # Warnings are errors, so this is a hard gate. The two allowed lints are
        # pre-existing findings (src/services/metadata.rs, src/ui/state.rs);
        # remove the allows once they are fixed.
        run: |
          cargo clippy --workspace --all-targets -- \
            -D warnings \
            -A clippy::never_loop -A clippy::large_enum_variant

      - name: Tests
        run: cargo test --workspace --locked

      # The release profile is built by the Release workflow (and its tag
      # quality gate), so rebuilding it here only duplicated a multi-minute
      # compile without validating anything extra.

  linux-assets:
    name: packaging assets are consistent
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Validate desktop entry
        run: |
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y --no-install-recommends desktop-file-utils
          desktop-file-validate packaging/debian/xur-porisoy.desktop

      - name: Validate AppStream metadata
        run: |
          sudo apt-get -o Acquire::Retries=5 install -y --no-install-recommends appstream
          appstreamcli validate --no-net packaging/debian/xur-porisoy.metainfo.xml

      - name: Shell script syntax
        run: |
          bash -n packaging/debian/build-deb.sh
          sh -n packaging/debian/postinst
          sh -n packaging/debian/prerm
          sh -n packaging/debian/postrm
          sh -n packaging/apt/install.sh
          python3 -m py_compile packaging/apt/build-repo.py
          sh -n docker/entrypoint.sh

  docker:
    name: Docker image builds and serves noVNC
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # The image compiles Rust inside the build (it is the only packaging
      # target that does), so this is a full release build on top of the
      # `check` job. The gha layer cache only helps when src/** is unchanged.
      - name: Validate compose file
        run: docker compose --file docker-compose.yml config --quiet

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          tags: xur-porisoy:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Boots the real stack headless: Xvfb -> x11vnc -> websockify. If the
      # binary were missing a dlopened GUI library, it would die within
      # seconds and the `docker top` check would fail.
      - name: Smoke test the noVNC stack
        run: |
          docker run -d --name xur-docker-smoke -p 127.0.0.1:6080:6080 xur-porisoy:ci
          ok=""
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:6080/vnc.html >/dev/null; then ok=1; break; fi
            sleep 2
          done
          if [ -z "$ok" ]; then
            echo "noVNC never answered on 6080" >&2
            docker logs xur-docker-smoke
            docker rm -f xur-docker-smoke
            exit 1
          fi
          # Give the app a moment to hit its startup panics (bad HOME,
          # missing dlopen library) before declaring success.
          sleep 10
          if ! docker top xur-docker-smoke | grep -q xur-porisoy; then
            echo "xur-porisoy process is not running" >&2
            docker logs xur-docker-smoke
            docker rm -f xur-docker-smoke
            exit 1
          fi
          docker rm -f xur-docker-smoke

      # The image is intentionally NOT pushed to a registry yet; pushing to
      # GHCR needs `packages: write` and a tag/push step gated on main.
